# CI —— 3 个并行 Job：Backend / Frontend / E2E
#
# 说明（首次启用前需人工复核一次）：
# 1. Backend 必须在 windows-latest：tests/ 含 5 个 Windows 专属测试
#    （netstat 端口探测 / powershell 父进程链 / C: 绝对路径 / 跨盘相对化）。
# 2. 依赖安装：后端 uv sync（pyproject.toml + uv.lock，无 requirements.txt）；
#    前端 npm ci（package-lock.json）。dist/ 被 git 忽略，任何需要 UI 的
#    Job（含 E2E）都必须自己构建 frontend/dist。
# 3. 镜像：pyproject [tool.uv] index-url 指向 tuna 镜像（本地开发用）；
#    CI runner 在海外，Backend/E2E Job 已用 job 级 env 显式覆盖
#    UV_INDEX_URL=https://pypi.org/simple，避免 tuna 对海外 IP 超时。
#    本地不用改 pyproject.toml。
# 4. E2E 目前（verify_canvas.py，36 断言）只测画布交互，不触发生成接口，
#    因此无需 mock 上游 API。未来若 E2E 覆盖「生成→回流」链路，必须先
#    mock core/api.py 的 generate_image（monkeypatch 返回固定图），
#    严禁 CI 直连真实上游（花钱）。落地前为 AGENTS.md「待办」。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend checks (pytest + ruff)
    runs-on: windows-latest
    env:
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        # --basetemp 用 runner 内置临时目录（${{ runner.temp }}，纯 ASCII 且必定可写）：
        # 本地命令用 `--basetemp=<ASCII 临时目录>`（见 AGENTS.md 活跃坑），CI 与本地命令不再互拷。
        run: uv run pytest --basetemp="${{ runner.temp }}/imagora-pytest"

  frontend:
    name: Frontend checks (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (canvas regression, Playwright)
    needs: [backend, frontend]
    runs-on: windows-latest
    env:
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: uv sync --group dev
      - name: Build frontend (dist/ is git-ignored)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium browser
        # playwright Python 包已进 pyproject.toml [dependency-groups] dev，上一步 uv sync 已装入 .venv；
        # 本步只下载浏览器二进制（--with-deps 仅 Linux 可用，Windows 免系统依赖，故不加）。
        run: |
          .\.venv\Scripts\python.exe -m playwright install chromium
      - name: Start server and run E2E
        shell: pwsh
        run: |
          # 服务输出落文件：万一没起来，下面能直接把原因打出来（原先 Hidden 且无重定向，失败时无线索）
          $server = Start-Process -FilePath ".\.venv\Scripts\python.exe" `
            -ArgumentList "-m", "main", "ui", "--no-browser", "--port", "7860" `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log
          try {
            # 等就绪再开浏览器：uvicorn 冷启动 + 前端 dist 静态挂载需要时间，
            # 起完立刻 goto 会 ERR_CONNECTION_REFUSED（曾实测偶发失败）
            $ready = $false
            foreach ($i in 1..60) {
              try {
                $null = Invoke-WebRequest "http://127.0.0.1:7860/api/config?win=1" -TimeoutSec 2 -UseBasicParsing
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Write-Host "::error::服务 60 秒内未就绪，以下是服务输出："
              Get-Content server.out.log, server.err.log -ErrorAction SilentlyContinue
              exit 1
            }
            .\.venv\Scripts\python.exe frontend\e2e\verify_canvas.py
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
        # TODO(mock): 若 E2E 新增生成链路覆盖，必须先 mock core/api.py 的
        # generate_image（返回固定测试图），并同步 AGENTS.md 待办与本文档第 4 条。