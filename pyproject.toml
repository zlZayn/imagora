[project]
name = "imagora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# FastAPI 惯例: B008 允许 File/Form 作为参数默认值; BLE001 允许路由层盲捕获兜底
# S110: 进程退出路径的静默清理（卸载 console handler）失败无害
extend-ignore = ["B008", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# 测试允许盲断言异常、简化导入写法
"tests/**" = ["B017", "PLR0402"]
